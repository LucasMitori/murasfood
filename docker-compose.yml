# =============================================================================
# MurasFood — development stack.
# Usage: `make up` (or `docker compose up -d --build`).
# Production uses docker-compose.prod.yml, which never runs dev servers.
# =============================================================================
name: murasfood

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-murasfood}
      POSTGRES_USER: ${POSTGRES_USER:-murasfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-murasfood}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-murasfood}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible object storage. Production points at Cloudflare R2/S3.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-murasfood}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-murasfood-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first boot so uploads work out of the box.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # The bucket also needs anonymous read. Public assets (product photos,
    # banners, the logo) are served to the browser as direct bucket URLs rather
    # than signed ones, so a private bucket makes every image on the storefront
    # 403 — which is exactly what it did.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-murasfood} ${S3_SECRET_KEY:-murasfood-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-murasfood-media} &&
      (mc anonymous set download local/${S3_BUCKET:-murasfood-media} ||
       mc policy set download local/${S3_BUCKET:-murasfood-media}) &&
      echo 'bucket ready and publicly readable'
      "
    restart: "no"

  # Catches every outgoing email in development. UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    # Both queues, or media tasks are routed somewhere nothing consumes.
    command: celery -A config worker --loglevel=info -Q celery,media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      # Node defaults the Nitro dev worker to ~2 GB, which this project's module
      # graph plus Vite's transform cache can reach on a long-running dev
      # session. The failure is opaque when it happens — every route answers
      # "Worker terminated due to reaching memory limit" — so the headroom is
      # worth more than the RAM.
      NUXT_DEV_MEMORY_LIMIT: "4096"
      NODE_OPTIONS: "--max-old-space-size=4096"
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      # The table-column contract test compares the dashboard's columns against
      # the generated OpenAPI schema, which lives outside `apps/web`. Without
      # this the test cannot even be collected in the container, so the one
      # guard that catches a column referring to a field the API stopped
      # returning was silently not running. Read-only: tests read it, and only
      # `make openapi` writes it.
      - ./docs:/docs:ro
    ports:
      - "3000:3000"
    depends_on:
      - api
    # The dev server answers on 3000 long before it can serve a usable page:
    # Vuetify's per-component stylesheets are compiled from SASS on demand and
    # took ~20s more to appear. Without this, `docker compose up` reported the
    # container ready immediately and whoever opened the browser first paid that
    # cost as 404s, an unstyled page, and navigation that only a hard reload
    # fixed. The probe requests the page and everything it references, so the
    # warm-up happens here rather than in someone's browser.
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.mjs"]
      # The first run warms the app; every run after it is one cheap request.
      # 30s rather than 15s because nothing here needs sub-minute detection, and
      # a dev server has better things to do than answer probes.
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
