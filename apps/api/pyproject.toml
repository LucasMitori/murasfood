[project]
name = "murasfood-api"
version = "0.1.0"
description = "MurasFood — white-label local commerce platform API"
requires-python = ">=3.12"

# =============================================================================
# Ruff — linting and formatting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "DJ",  # flake8-django
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008",   # DRF/Django idioms rely on calls in defaults
    "RUF012", # Django class attributes are conventionally mutable
    # Customer-facing copy and documentation are written in Portuguese and use
    # typographic punctuation (ç, ã, —). Flagging those as "ambiguous unicode"
    # would mean mangling the product's own language.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]
# Inline-styled HTML email markup: re-wrapping the lines would change the output.
"apps/notifications/templates_seed.py" = ["E501"]
"config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]
addopts = "--strict-markers --disable-warnings"
markers = [
    "slow: tests that exercise heavier flows",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# =============================================================================
# mypy — advisory, tightened incrementally
# =============================================================================
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
