    OrderStatusEnum:
      enum:
      - DRAFT
      - PENDING_PAYMENT
      - PAYMENT_PROCESSING
      - PAID
      - CONFIRMED
      - PREPARING
      - READY_FOR_PICKUP
      - OUT_FOR_DELIVERY
      - DELIVERED
      - COMPLETED
      - CANCELLED
      - PAYMENT_FAILED
      - REFUNDED
      - PARTIALLY_REFUNDED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PENDING_PAYMENT` - Awaiting payment
        * `PAYMENT_PROCESSING` - Processing payment
        * `PAID` - Paid
        * `CONFIRMED` - Confirmed
        * `PREPARING` - Being prepared
        * `READY_FOR_PICKUP` - Ready for pickup
        * `OUT_FOR_DELIVERY` - Out for delivery
        * `DELIVERED` - Delivered
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `PAYMENT_FAILED` - Payment failed
        * `REFUNDED` - Refunded
        * `PARTIALLY_REFUNDED` - Partially refunded
    OrderStatusHistory:
      type: object
      properties:
        id:
