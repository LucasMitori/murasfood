          type: boolean
          title: Ativo
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BudgetLine'
        period:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
      required:
      - created_at
