        ``tenant_required = False`` allows endpoints that legitimately work without
        a tenant (platform-level administration).
      parameters:
      - in: query
        name: field
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
