    TenantSettings:
      type: object
      description: |-
        Merchant-editable settings.

        `floating_tools` is validated rather than trusted: it is free-form JSON in
        the database, so without a check a typo in a tool name would be stored
        happily and then silently drop that shortcut from the storefront.
      properties:
        order_number_prefix:
          type: string
          maxLength: 8
        allow_orders_when_closed:
          type: boolean
          title: Accept orders while closed
          description: Scheduled orders placed outside business hours.
        auto_confirm_paid_orders:
          type: boolean
        max_items_per_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        prices_include_tax:
          type: boolean
          description: Brazilian retail displays tax-inclusive prices.
        default_tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Default tax rate (%)
        allow_backorder:
          type: boolean
          title: Allow selling without stock
          description: 'When off, stock can never go negative (invariant #6).'
        low_stock_threshold:
          type: integer
          maximum: 2147483647
          minimum: 0
        hide_out_of_stock:
          type: boolean
          title: Hide products that are out of stock
          description: Off by default. An empty shelf a shopper can ask to be told
            about is a sale delayed; one they never see is a sale lost, and the shop
            learns nothing about the demand it missed.
        notify_on_new_order:
          type: boolean
          title: Notify staff about new orders
        email_sender_name:
          type: string
          maxLength: 120
        email_reply_to:
          title: Reply-to
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        privacy_policy_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        terms_url:
          title: Terms of use URL
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        floating_tools:
          description: Which shortcuts the floating button offers, and in what order.
        home_layout: {}
        hero: {}
        smtp_host:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        smtp_username:
          type: string
          maxLength: 255
        smtp_use_tls:
          type: boolean
          title: Use TLS
        smtp_from_email:
          title: From address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        smtp_password_set:
          type: boolean
          readOnly: true
      required:
      - smtp_password_set
    TenantSettingsRequest:
      type: object
      description: |-
        Merchant-editable settings.

        `floating_tools` is validated rather than trusted: it is free-form JSON in
        the database, so without a check a typo in a tool name would be stored
        happily and then silently drop that shortcut from the storefront.
      properties:
        order_number_prefix:
          type: string
          minLength: 1
          maxLength: 8
        allow_orders_when_closed:
          type: boolean
          title: Accept orders while closed
          description: Scheduled orders placed outside business hours.
        auto_confirm_paid_orders:
          type: boolean
        max_items_per_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        prices_include_tax:
          type: boolean
          description: Brazilian retail displays tax-inclusive prices.
        default_tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Default tax rate (%)
        allow_backorder:
          type: boolean
          title: Allow selling without stock
          description: 'When off, stock can never go negative (invariant #6).'
        low_stock_threshold:
          type: integer
          maximum: 2147483647
          minimum: 0
        hide_out_of_stock:
          type: boolean
          title: Hide products that are out of stock
          description: Off by default. An empty shelf a shopper can ask to be told
            about is a sale delayed; one they never see is a sale lost, and the shop
            learns nothing about the demand it missed.
        notify_on_new_order:
          type: boolean
          title: Notify staff about new orders
        email_sender_name:
          type: string
          maxLength: 120
        email_reply_to:
          title: Reply-to
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        privacy_policy_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        terms_url:
          title: Terms of use URL
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        floating_tools:
          description: Which shortcuts the floating button offers, and in what order.
        home_layout: {}
        hero: {}
        smtp_host:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        smtp_username:
          type: string
          maxLength: 255
        smtp_password:
          type: string
          writeOnly: true
        smtp_use_tls:
          type: boolean
