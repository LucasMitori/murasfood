  /api/v1/admin/dashboard/:
    get:
      operationId: admin_dashboard
      description: |-
        Merchant dashboard.

        One request returns every metric and chart series, all aggregated in
        PostgreSQL. The browser renders; it does not compute.
      parameters:
      - in: query
        name: end
        schema:
          type: string
        description: ISO date, used with period=custom
      - in: query
        name: period
        schema:
          type: string
        description: today | yesterday | last_7 | last_30 | month | previous_month
          | year | custom
      - in: query
        name: start
        schema:
          type: string
        description: ISO date, used with period=custom
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/admin/email-logs/:
    get:
      operationId: admin_email_logs_list
      description: Delivery log — the answer to "did the customer get the email?".
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: related_id
        schema:
          type: string
      - in: query
        name: related_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - FAILED
          - QUEUED
          - RETRYING
          - SENT
        description: |-
          * `QUEUED` - Queued
          * `SENT` - Sent
          * `FAILED` - Failed
          * `RETRYING` - Retrying
      - in: query
        name: template_key
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmailLogList'
          description: ''
