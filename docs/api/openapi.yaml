components:
  schemas:
    AccountTypeEnum:
      enum:
      - CASH
      - BANK
      - CARD
      - OTHER
      type: string
      description: |-
        * `CASH` - Cash
        * `BANK` - Bank account
        * `CARD` - Card acquirer
        * `OTHER` - Other
    AddItemRequest:
      type: object
      properties:
        product:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        note:
          type: string
          default: ''
          maxLength: 255
      required:
      - product
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 60
        recipient_name:
          type: string
          title: Recipient
          maxLength: 160
        postal_code:
          type: string
          maxLength: 16
        street:
          type: string
          maxLength: 255
        number:
          type: string
          maxLength: 32
        complement:
          type: string
          maxLength: 120
        neighborhood:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 64
        country:
          type: string
          maxLength: 2
        reference:
          type: string
          title: Reference point
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
          title: Default address
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
      required:
      - city
      - created_at
      - id
      - neighborhood
      - number
      - postal_code
      - recipient_name
      - state
      - street
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        recipient_name:
          type: string
          minLength: 1
          title: Recipient
          maxLength: 160
        postal_code:
          type: string
          minLength: 1
          maxLength: 16
        street:
          type: string
          minLength: 1
          maxLength: 255
        number:
          type: string
          minLength: 1
          maxLength: 32
        complement:
          type: string
          maxLength: 120
        neighborhood:
          type: string
          minLength: 1
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          minLength: 1
          maxLength: 64
        country:
          type: string
          minLength: 1
          maxLength: 2
        reference:
          type: string
          title: Reference point
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
          title: Default address
      required:
      - city
      - neighborhood
      - number
      - postal_code
      - recipient_name
      - state
      - street
    ApplyCouponRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Null for system-initiated actions such as webhooks.
        actor_label:
          type: string
          readOnly: true
          description: Kept so the trail stays readable after an account is anonymised.
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
