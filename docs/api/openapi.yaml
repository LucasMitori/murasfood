        permissions:
          type: array
          items:
            type: string
          description: |-
            Permission codes, so the dashboard can hide what the user cannot do.

            The frontend uses this for affordances only — the API re-checks every
            call regardless.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
      required:
      - avatar
      - created_at
      - email
      - full_name
      - id
      - is_verified
      - permissions
      - roles
      - user_type
    UserPermissions:
      type: object
      description: Read model for the permissions tab of the user editor.
      properties:
        direct:
          type: array
          items:
            type: string
        from_roles:
          type: array
          items:
            type: string
        effective:
          type: array
          items:
            type: string
      required:
      - direct
      - effective
      - from_roles
    UserPermissionsWriteRequest:
      type: object
      description: Replaces the set of *direct* grants. Role permissions are untouched.
      properties:
        codes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - codes
    UserRolesWriteRequest:
      type: object
      description: Replaces the set of assigned roles.
      properties:
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - roles
    UserTypeEnum:
      enum:
      - CUSTOMER
      - STAFF
      - MANAGER
      - ADMINISTRATOR
      - PLATFORM_ADMIN
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `STAFF` - Staff
        * `MANAGER` - Manager
        * `ADMINISTRATOR` - Administrator
        * `PLATFORM_ADMIN` - Platform administrator
    WeekdayEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
      description: |-
        * `1` - Segunda-feira
        * `2` - Terça-feira
        * `3` - Quarta-feira
        * `4` - Quinta-feira
        * `5` - Sexta-feira
        * `6` - Sábado
        * `7` - Domingo
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
