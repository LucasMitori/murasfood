openapi: 3.0.3
info:
  title: MurasFood API
  version: 1.0.0
  description: 'White-label local commerce platform. Multi-tenant: every request is
    scoped to a tenant resolved from the authenticated user, the `X-Tenant` header
    or the request subdomain.'
paths:
  /api/v1/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_list
      description: |-
        Resolves and enforces the tenant for a view.

        ``tenant_required = False`` allows endpoints that legitimately work without
        a tenant (platform-level administration).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: O valor do cursor de paginação.
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/audit-logs/{id}/:
    get:
      operationId: admin_audit_logs_retrieve
      description: |-
        Resolves and enforces the tenant for a view.

        ``tenant_required = False`` allows endpoints that legitimately work without
        a tenant (platform-level administration).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este audit log.
        required: true
      tags:
      - admin
