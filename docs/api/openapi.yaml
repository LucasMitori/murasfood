        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - in: query
        name: reason
        schema:
          type: string
          enum:
          - COST_CHANGE
          - IMPORT
          - INITIAL
          - MANUAL
          - PROMOTION
          - SCHEDULED
        description: |-
          * `INITIAL` - Initial price
          * `MANUAL` - Manual change
          * `PROMOTION` - Promotion
          * `COST_CHANGE` - Cost change
          * `SCHEDULED` - Scheduled change
          * `IMPORT` - Bulk import
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
