name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, type check, and the full pytest suite against real Postgres.
  # ---------------------------------------------------------------------------
  api:
    name: API (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: murasfood_test
          POSTGRES_USER: murasfood
          POSTGRES_PASSWORD: murasfood
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U murasfood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DATABASE_URL: postgres://murasfood:murasfood@localhost:5432/murasfood_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy .
        continue-on-error: true # advisory until annotations reach full coverage

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  # ---------------------------------------------------------------------------
  # Frontend: ESLint, vue-tsc, vitest, and a real production build.
  # ---------------------------------------------------------------------------
  web:
    name: Web (Nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare Nuxt types
        run: npm run postinstall

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Images build only after both suites pass. Deployment stays manual until
  # production secrets are configured for a specific merchant.
  # ---------------------------------------------------------------------------
  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
